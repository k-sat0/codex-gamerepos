<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eefbff">
  <meta name="description" content="ちょっとした時間に楽しめる、小さなゲームとアプリの広場。スマホでもPCでも、気軽に遊ぼう。">
  <title>あそびの広場 | 小さなゲームとアプリ</title>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="hub">
    <div class="top-bar">
      <span class="site-mark" aria-label="ソーダポップテーマ">SODA POP</span>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="ダークテーマに切り替える">
        <span data-theme-icon aria-hidden="true">☾</span><span data-theme-label>ダーク</span>
      </button>
    </div>
    <header class="intro">
      <span class="eyebrow">SMALL APPS, HAPPY BREAKS</span>
      <h1>あそびの広場<span class="logo-dot" aria-hidden="true"></span></h1>
      <p>ちょっとひと息、なにして遊ぶ？<br>小さなゲームとアプリを、気の向くままに。</p>
    </header>
    <section aria-labelledby="apps-heading">
      <div class="section-heading"><h2 id="apps-heading">アプリ一覧</h2><span>スマホでも、PCでも。</span></div>
      <div class="app-grid">
        <article class="app-card">
          <div class="app-preview" aria-hidden="true"><span class="preview-dot">＋1</span><span class="preview-label">30 SECOND CHALLENGE</span></div>
          <div class="app-info">
            <span class="tag">ゲーム · 30秒</span>
            <h3>まるタップ</h3>
            <p>動く丸をねらってタップ。<br>30秒で何回つかまえられる？</p>
            <a class="play-link" href="./apps/maru-tap/index.html" aria-label="まるタップで遊ぶ">遊ぶ <span aria-hidden="true">↗</span></a>
          </div>
        </article>
      </div>
    </section>
    <footer>日常のすきまに、ちいさな楽しみを。</footer>
  </main>
</body>
</html>
